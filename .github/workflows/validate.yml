name: validate

on:
  pull_request:
  push:
    branches: [main]
  # Upstream package releases can break the lab check's pinned drivers without
  # any change here; the weekly run catches that before a lab does.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck
      - name: Validate
        run: ./infra validate ${{ matrix.cloud }}

  # Installs each pinned driver set from PyPI and exercises the APIs the lab
  # check notebook calls, on the Python version of the current LTS runtime.
  lab-check-drivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lab check driver sets
        run: python3 tests/test_lab_check_drivers.py

  # macOS ships bash 3.2 as /bin/bash and Python 3.9 as /usr/bin/python3, the
  # oldest versions ./infra supports; operators commonly run it with them.
  cli-macos-system-tools:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          command -v rg >/dev/null || brew install ripgrep
          command -v jq >/dev/null || brew install jq
      # ./infra uses `#!/usr/bin/env bash` and runs `python3`; put the system
      # versions first on PATH rather than Homebrew's.
      - name: Prefer the system bash and Python
        run: |
          mkdir -p "$RUNNER_TEMP/system"
          ln -sf /bin/bash "$RUNNER_TEMP/system/bash"
          ln -sf /usr/bin/python3 "$RUNNER_TEMP/system/python3"
          echo "$RUNNER_TEMP/system" >> "$GITHUB_PATH"
      - name: CLI tests with the system bash and Python
        run: |
          bash --version | head -1
          python3 --version
          bash tests/test_infra_auth_setup.sh
